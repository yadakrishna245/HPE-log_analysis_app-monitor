name: 🚫 Revoke License

on:
  workflow_dispatch:
    inputs:
      license_key:
        description: 'License key to revoke (e.g., LS-XXXX-XXXX-XXXX-XXXX)'
        required: true

permissions:
  contents: write

jobs:
  revoke:
    runs-on: ubuntu-latest
    env:
      LICENSE_KEY_INPUT: ${{ github.event.inputs.license_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Input Format
        run: |
          # Validate license key format (only alphanumeric + dashes)
          if ! echo "$LICENSE_KEY_INPUT" | grep -qE '^[A-Z0-9-]{10,30}$'; then
            echo "❌ Invalid license key format"
            exit 1
          fi

      - name: Revoke License
        run: |
          python3 << 'EOF'
          import json, os
          
          key_to_revoke = os.environ.get('LICENSE_KEY_INPUT', '')
          
          with open('licenses.json', 'r') as f:
              data = json.load(f)
          
          found = False
          for lic in data['licenses']:
              if lic['key'] == key_to_revoke:
                  lic['active'] = False
                  lic['revoked_at'] = __import__('datetime').datetime.now().strftime('%Y-%m-%d')
                  found = True
                  print(f"🚫 Revoked license: {key_to_revoke}")
                  print(f"   Domain: {lic['domain']}")
                  print(f"   Issued to: {lic['issued_to']}")
                  break
          
          if not found:
              print(f"❌ License not found: {key_to_revoke}")
              exit(1)
          
          with open('licenses.json', 'w') as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Commit
        run: |
          git config user.name "License Bot"
          git config user.email "license@logsherlock.pro"
          git add licenses.json
          git commit -m "🚫 Revoked license key"
          git push
