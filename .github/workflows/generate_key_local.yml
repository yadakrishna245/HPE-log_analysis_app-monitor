name: 🔑 Generate Key for Local ZIP Folder

on:
  workflow_dispatch:
    inputs:
      user_name:
        description: 'User full name (e.g., Rahul Sharma)'
        required: true
      days:
        description: 'Access duration'
        required: true
        type: choice
        options:
          - '7'
          - '20'
          - '30'
          - '90'
          - '365'
          - 'lifetime'
      custom_key:
        description: 'Custom key (optional, e.g., LS-HPE-RAHUL-L4-2026). Leave blank for auto-generate'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate License & Update licenses.json
        id: gen
        run: |
          python3 << 'EOF'
          import json, os, secrets, hashlib
          from datetime import datetime, timedelta

          user_name = os.environ.get('INPUT_USER', '').strip()
          days_input = os.environ.get('INPUT_DAYS', '7').strip()
          custom_key = os.environ.get('INPUT_KEY', '').strip()

          # Calculate days and expiry
          if days_input == 'lifetime':
              days = 99999
              expires_at = '2099-12-31'
              note = 'Lifetime access'
              key_type = 'master'
          else:
              days = int(days_input)
              expires_at = (datetime.now() + timedelta(days=days)).strftime('%Y-%m-%d')
              note = f'{days}-day access'
              key_type = 'standard' if days <= 30 else 'master'

          issued_at = datetime.now().strftime('%Y-%m-%d')

          # Generate key
          if custom_key:
              license_key = custom_key.upper().replace(' ', '-')
              # Ensure 5+ parts for master key format
              if len(license_key.split('-')) < 5:
                  license_key = license_key + '-HPE'
          else:
              # Auto-generate: LS-PRO-<NAME_INITIALS>-<RANDOM>-<YEAR>
              initials = ''.join([w[0] for w in user_name.split() if w]).upper()[:4]
              rand = secrets.token_hex(2).upper()
              license_key = f'LS-PRO-{initials}-{rand}-2026'

          # Load licenses.json
          with open('licenses.json', 'r') as f:
              data = json.load(f)

          # Check if key already exists
          existing_keys = [l['key'] for l in data['licenses']]
          if license_key in existing_keys:
              print(f'❌ ERROR: Key {license_key} already exists! Use a different key.')
              exit(1)

          # Add new entry
          new_entry = {
              "key": license_key,
              "issued_to": user_name,
              "issued_at": issued_at,
              "expires_at": expires_at,
              "type": key_type,
              "active": True,
              "days": days_input,
              "fingerprint": "",
              "note": note
          }
          data['licenses'].append(new_entry)
          data['last_updated'] = issued_at

          # Save
          with open('licenses.json', 'w') as f:
              json.dump(data, f, indent=2)

          # Output summary
          print(f'')
          print(f'╔══════════════════════════════════════════════════╗')
          print(f'║   🔑 LICENSE KEY GENERATED SUCCESSFULLY          ║')
          print(f'╠══════════════════════════════════════════════════╣')
          print(f'║  Key:        {license_key}')
          print(f'║  User:       {user_name}')
          print(f'║  Duration:   {days_input} days')
          print(f'║  Expires:    {expires_at}')
          print(f'║  Type:       {key_type}')
          print(f'╠══════════════════════════════════════════════════╣')
          print(f'║  📋 SHARE WITH USER:                             ║')
          print(f'║  1. Give them LogSherlock-Pro.zip                ║')
          print(f'║  2. Tell them to enter name: {user_name}')
          print(f'║  3. Tell them to enter key:  {license_key}')
          print(f'╚══════════════════════════════════════════════════╝')
          print(f'')
          EOF
        env:
          INPUT_USER: ${{ github.event.inputs.user_name }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_KEY: ${{ github.event.inputs.custom_key }}

      - name: Commit & Push
        run: |
          git config user.name "License Bot"
          git config user.email "license@logsherlock.pro"
          git add licenses.json
          git commit -m "🔑 License generated for ${{ github.event.inputs.user_name }} (${{ github.event.inputs.days }} days)"
          git push
