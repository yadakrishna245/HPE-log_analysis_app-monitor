name: 🛡️ Access Monitor

on:
  repository_dispatch:
    types: [access_ping, user_registered]

permissions:
  contents: write

jobs:
  log-access:
    runs-on: ubuntu-latest
    env:
      EVENT_TYPE: ${{ github.event.action }}
      PAYLOAD_DOMAIN: ${{ github.event.client_payload.domain }}
      PAYLOAD_USER_NAME: ${{ github.event.client_payload.user_name }}
      PAYLOAD_TIMESTAMP: ${{ github.event.client_payload.timestamp }}
      PAYLOAD_USER_AGENT: ${{ github.event.client_payload.user_agent }}
      PAYLOAD_PAGE_URL: ${{ github.event.client_payload.page_url }}
      PAYLOAD_EMAIL: ${{ github.event.client_payload.email }}
      PAYLOAD_MOBILE: ${{ github.event.client_payload.mobile }}
      PAYLOAD_LICENSE_KEY: ${{ github.event.client_payload.license_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process Ping
        id: process
        run: |
          echo "📍 Event: $EVENT_TYPE from: $PAYLOAD_DOMAIN"
          echo "👤 User: $PAYLOAD_USER_NAME ($PAYLOAD_EMAIL)"
          
          # Check if domain is authorized (using env vars safely)
          AUTHORIZED=$(python3 -c "
          import json, os
          with open('authorized_domains.json') as f:
              data = json.load(f)
          domain = os.environ.get('PAYLOAD_DOMAIN', '')
          print('true' if domain in data['authorized_domains'] else 'false')
          ")
          
          echo "authorized=$AUTHORIZED" >> $GITHUB_OUTPUT
          echo "domain=$PAYLOAD_DOMAIN" >> $GITHUB_OUTPUT
          echo "user_name=$PAYLOAD_USER_NAME" >> $GITHUB_OUTPUT
          echo "timestamp=$PAYLOAD_TIMESTAMP" >> $GITHUB_OUTPUT
          echo "email=$PAYLOAD_EMAIL" >> $GITHUB_OUTPUT
          echo "event_type=$EVENT_TYPE" >> $GITHUB_OUTPUT
          
          # Update access log (using env vars - no injection possible)
          python3 << 'EOF'
          import json, os
          from datetime import datetime
          
          with open('access_log.json', 'r') as f:
              log = json.load(f)
          
          event = {
              "domain": os.environ.get('PAYLOAD_DOMAIN', ''),
              "user_name": os.environ.get('PAYLOAD_USER_NAME', ''),
              "email": os.environ.get('PAYLOAD_EMAIL', ''),
              "mobile": os.environ.get('PAYLOAD_MOBILE', ''),
              "timestamp": os.environ.get('PAYLOAD_TIMESTAMP', ''),
              "user_agent": os.environ.get('PAYLOAD_USER_AGENT', ''),
              "page_url": os.environ.get('PAYLOAD_PAGE_URL', ''),
              "license_key": os.environ.get('PAYLOAD_LICENSE_KEY', ''),
              "event_type": os.environ.get('EVENT_TYPE', ''),
              "authorized": os.environ.get('AUTHORIZED', 'false') == 'true',
              "logged_at": datetime.utcnow().isoformat() + "Z"
          }
          
          log["events"].append(event)
          log["total_access_count"] = len(log["events"])
          log["unauthorized_count"] = len([e for e in log["events"] if not e.get("authorized", True)])
          
          if len(log["events"]) > 1000:
              log["events"] = log["events"][-1000:]
          
          with open('access_log.json', 'w') as f:
              json.dump(log, f, indent=2)
          EOF

          # If user_registered event, also save to user_registrations.json
          if [ "$EVENT_TYPE" = "user_registered" ]; then
            python3 << 'EOF2'
          import json, os
          from datetime import datetime
          
          with open('user_registrations.json', 'r') as f:
              reg = json.load(f)
          
          email = os.environ.get('PAYLOAD_EMAIL', '')
          existing = [r for r in reg["registrations"] if r.get("email") == email]
          
          if not existing:
              reg["registrations"].append({
                  "name": os.environ.get('PAYLOAD_USER_NAME', ''),
                  "email": email,
                  "mobile": os.environ.get('PAYLOAD_MOBILE', ''),
                  "domain": os.environ.get('PAYLOAD_DOMAIN', ''),
                  "license_key": os.environ.get('PAYLOAD_LICENSE_KEY', ''),
                  "registered_at": os.environ.get('PAYLOAD_TIMESTAMP', ''),
                  "logged_at": datetime.utcnow().isoformat() + "Z"
              })
              reg["total_users"] = len(reg["registrations"])
          
          with open('user_registrations.json', 'w') as f:
              json.dump(reg, f, indent=2)
          
          # Update USERS.md table
          header = "# 👤 Registered Users\n\n"
          header += "| # | Name | Email | Mobile | License Key | Domain | Registered At |\n"
          header += "|---|------|-------|--------|-------------|--------|---------------|\n"
          rows = ""
          for i, u in enumerate(reg["registrations"], 1):
              rows += f"| {i} | {u['name']} | {u['email']} | {u['mobile']} | `{u['license_key']}` | {u['domain']} | {u['registered_at']} |\n"
          footer = f"\n---\n**Total Users: {len(reg['registrations'])}** | *Auto-updated by GitHub Actions*\n"
          
          with open('USERS.md', 'w') as f:
              f.write(header + rows + footer)
          
          print(f"👤 User registered: {email} (Total: {len(reg['registrations'])})")
          EOF2
          fi

      - name: Commit Logs
        run: |
          git config user.name "Access Monitor Bot"
          git config user.email "monitor@logsherlock.pro"
          git add access_log.json user_registrations.json USERS.md
          git diff --staged --quiet || git commit -m "📍 access event: ${{ steps.process.outputs.user_name }} from ${{ steps.process.outputs.domain }}"
          git push

      - name: 🚨 Send Gmail Alert (Unauthorized)
        if: steps.process.outputs.authorized == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: yadakrishna245@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🚨 UNAUTHORIZED LogSherlock Access from ${{ steps.process.outputs.domain }}"
          to: yadakrishna245@gmail.com
          from: LogSherlock Monitor <yadakrishna245@gmail.com>
          body: |
            ⚠️ UNAUTHORIZED ACCESS DETECTED
            
            🌐 Domain: ${{ steps.process.outputs.domain }}
            👤 User: ${{ steps.process.outputs.user_name }}
            📧 Email: ${{ steps.process.outputs.email }}
            🕐 Time: ${{ steps.process.outputs.timestamp }}
            
            ACTION: Check who deployed your code without permission.
            
            — LogSherlock Access Monitor

      - name: 📧 New User Registration Alert
        if: steps.process.outputs.event_type == 'user_registered'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: yadakrishna245@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "👤 New User Activated: ${{ steps.process.outputs.user_name }}"
          to: yadakrishna245@gmail.com
          from: LogSherlock Monitor <yadakrishna245@gmail.com>
          body: |
            New user activated LogSherlock Pro!
            
            👤 Name: ${{ steps.process.outputs.user_name }}
            📧 Email: ${{ steps.process.outputs.email }}
            🌐 Domain: ${{ steps.process.outputs.domain }}
            🕐 Time: ${{ steps.process.outputs.timestamp }}
            
            — LogSherlock License System
