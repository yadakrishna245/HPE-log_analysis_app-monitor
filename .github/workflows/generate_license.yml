name: 🔑 Generate License Key

on:
  workflow_dispatch:
    inputs:
      days_valid:
        description: 'Days valid (default: 7)'
        required: false
        default: '7'
      issued_to:
        description: 'Person name (optional)'
        required: false
        default: 'User'
      domain:
        description: 'Domain (leave default for your CloudFront)'
        required: false
        default: 'd3tv1czat55yad.cloudfront.net'
      license_type:
        description: 'License type'
        required: false
        type: choice
        options:
          - standard
          - extended
          - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      INPUT_DOMAIN: ${{ github.event.inputs.domain }}
      INPUT_ISSUED_TO: ${{ github.event.inputs.issued_to }}
      INPUT_DAYS: ${{ github.event.inputs.days_valid }}
      INPUT_TYPE: ${{ github.event.inputs.license_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Inputs
        run: |
          # Validate domain (alphanumeric, dots, dashes only)
          if ! echo "$INPUT_DOMAIN" | grep -qE '^[a-zA-Z0-9._-]+$'; then
            echo "❌ Invalid domain format"
            exit 1
          fi
          # Validate days (numeric only)
          if ! echo "$INPUT_DAYS" | grep -qE '^[0-9]+$'; then
            echo "❌ Invalid days value"
            exit 1
          fi

      - name: Generate License Key
        id: gen
        run: |
          python3 << 'EOF'
          import json, os
          import hashlib
          import secrets
          from datetime import datetime, timedelta
          
          domain = os.environ.get('INPUT_DOMAIN', 'd3tv1czat55yad.cloudfront.net')
          issued_to = os.environ.get('INPUT_ISSUED_TO', 'User')
          days = int(os.environ.get('INPUT_DAYS', '7'))
          license_type = os.environ.get('INPUT_TYPE', 'standard')
          
          # Load existing licenses
          with open('licenses.json', 'r') as f:
              data = json.load(f)
          
          # Generate unique license key
          salt = data['secret_salt']
          raw = f"{domain}:{issued_to}:{salt}:{secrets.token_hex(8)}"
          hash_val = hashlib.sha256(raw.encode()).hexdigest()[:16].upper()
          license_key = f"LS-{hash_val[:4]}-{hash_val[4:8]}-{hash_val[8:12]}-{hash_val[12:16]}"
          
          # Calculate expiry
          issued_at = datetime.now().strftime('%Y-%m-%d')
          expires_at = (datetime.now() + timedelta(days=days)).strftime('%Y-%m-%d')
          
          # Add to licenses
          new_license = {
              "key": license_key,
              "domain": domain,
              "issued_to": issued_to,
              "issued_at": issued_at,
              "expires_at": expires_at,
              "type": license_type,
              "active": True
          }
          data['licenses'].append(new_license)
          data['last_updated'] = issued_at
          
          with open('licenses.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"✅ License generated!")
          print(f"🔑 Key: {license_key}")
          print(f"🌐 Domain: {domain}")
          print(f"👤 Issued to: {issued_to}")
          print(f"📅 Expires: {expires_at}")
          print(f"📋 Type: {license_type}")
          EOF

      - name: Commit Updated Licenses
        run: |
          git config user.name "License Bot"
          git config user.email "license@logsherlock.pro"
          git add licenses.json
          git commit -m "🔑 New license generated for $INPUT_DOMAIN"
          git push

      - name: 📧 Email License to Krishna
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: yadakrishna245@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🔑 New LogSherlock License Generated"
          to: yadakrishna245@gmail.com
          from: LogSherlock License <yadakrishna245@gmail.com>
          body: |
            New license key generated:
            
            🔑 Check licenses.json for the new key
            🌐 Domain: ${{ github.event.inputs.domain }}
            👤 Issued to: ${{ github.event.inputs.issued_to }}
            📅 Valid for: ${{ github.event.inputs.days_valid }} days
            📋 Type: ${{ github.event.inputs.license_type }}
            
            Share this key with the user. They enter it in LogSherlock Settings.
            
            — LogSherlock License System
